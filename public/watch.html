<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Platform Watch Party</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Multi-Platform Watch Party</h1>
            <div class="stats">
                <span id="userCount">0</span> online
            </div>
        </header>

        <div class="source-selector">
            <select id="platformSelect">
                <option value="youtube">YouTube</option>
                <option value="googledrive">Google Drive</option>
                <option value="netflix">Netflix</option>
                <option value="prime">Amazon Prime</option>
                <option value="disney">Disney+</option>
                <option value="hbo">HBO Max</option>
            </select>
            <input type="text" id="sourceUrlInput" placeholder="Paste URL or video ID">
            <button id="loadSourceBtn">Load & Sync</button>
        </div>

        <div class="main-layout">
            <div class="video-section">
                <div id="player-container">
                    <div id="player"></div>
                    <div id="embedFallback" style="display: none;">
                        <iframe id="embedFrame" width="100%" height="400" frameborder="0" allowfullscreen></iframe>
                    </div>
                </div>
                <div class="playback-controls">
                    <button id="playBtn">▶ Play</button>
                    <button id="pauseBtn">⏸ Pause</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="user-list">
                    <h3>Online Users</h3>
                    <ul id="userList"></ul>
                </div>
                <div class="chat">
                    <h3>Chat</h3>
                    <div id="messages"></div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="client.js"></script>
</body>
</html>
