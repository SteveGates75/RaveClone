<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Watch Party</title>
    <link href="https://vjs.zencdn.net/8.3.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎥 Universal Watch Party</h1>
            <div class="stats">
                <span id="userCount">0</span> online
            </div>
        </header>

        <div class="url-loader">
            <input type="text" id="videoUrlInput" placeholder="Paste YouTube URL, Google Drive link, or direct video URL">
            <button id="loadVideoBtn">Load & Sync</button>
            <div id="loadStatus" class="status"></div>
        </div>

        <div class="main-layout">
            <div class="video-section">
                <div id="player-container">
                    <video
                        id="player"
                        class="video-js vjs-big-play-centered"
                        controls
                        preload="auto"
                        data-setup='{"fluid": true}'
                    ></video>
                </div>
                <div class="playback-controls">
                    <button id="playBtn">▶ Play</button>
                    <button id="pauseBtn">⏸ Pause</button>
                </div>
            </div>

            <div class="sidebar">
                <div class="user-list">
                    <h3>Online Users</h3>
                    <ul id="userList"></ul>
                </div>
                <div class="chat">
                    <h3>Chat</h3>
                    <div id="messages"></div>
                    <div class="chat-input">
                        <input type="text" id="messageInput" placeholder="Type a message...">
                        <button id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://vjs.zencdn.net/8.3.0/video.min.js"></script>
    <!-- YouTube plugin for Video.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/2.6.1/Youtube.min.js"></script>
    <script src="client.js"></script>
</body>
</html>
