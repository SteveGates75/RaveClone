<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Clone - Verify Payment</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; }
        input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; }
        button { background: #2196F3; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ddd; display: none; }
    </style>
</head>
<body>
    <h1>🔍 Verify Payment</h1>
    <form id="verifyForm">
        <label>Transaction Reference:</label>
        <input type="text" id="reference" placeholder="e.g., txn_abc123" required>
        <button type="submit">Check Status</button>
    </form>

    <div id="result">
        <h3>Transaction Details</h3>
        <p><strong>Reference:</strong> <span id="ref"></span></p>
        <p><strong>Amount:</strong> <span id="amt"></span></p>
        <p><strong>Email:</strong> <span id="eml"></span></p>
        <p><strong>Status:</strong> <span id="status"></span></p>
        <p><strong>Created At:</strong> <span id="created"></span></p>
    </div>

    <script>
        // Pre-fill reference from URL query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const refParam = urlParams.get('reference');
        if (refParam) {
            document.getElementById('reference').value = refParam;
            // Automatically verify? We'll let user click button.
        }

        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const reference = document.getElementById('reference').value;

            const response = await fetch(`/api/verify/${reference}`);
            if (response.status === 404) {
                alert('Transaction not found');
                return;
            }
            const data = await response.json();
            if (data.status === 'success') {
                document.getElementById('ref').innerText = data.data.reference;
                document.getElementById('amt').innerText = data.data.amount;
                document.getElementById('eml').innerText = data.data.email;
                document.getElementById('status').innerText = data.data.paymentStatus;
                document.getElementById('created').innerText = new Date(data.data.createdAt).toLocaleString();
                document.getElementById('result').style.display = 'block';
            } else {
                alert('Error fetching transaction');
            }
        });
    </script>
</body>
</html>
