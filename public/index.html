<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rave Clone - Watch Together</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Rave Clone</h1>
        <p>Watch YouTube videos with friends in sync!</p>
        <div class="actions">
            <button id="createRoomBtn">Create a Room</button>
            <div class="join">
                <input type="text" id="roomIdInput" placeholder="Enter Room ID" maxlength="6">
                <button id="joinRoomBtn">Join Room</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('createRoomBtn').addEventListener('click', () => {
            fetch('/create-room', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    window.location.href = `/watch.html?room=${data.roomId}`;
                });
        });

        document.getElementById('joinRoomBtn').addEventListener('click', () => {
            const roomId = document.getElementById('roomIdInput').value.trim().toUpperCase();
            if (roomId) {
                window.location.href = `/watch.html?room=${roomId}`;
            }
        });
    </script>
</body>
</html>
