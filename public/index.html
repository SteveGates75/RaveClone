<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Watch Party</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 Universal Watch Party</h1>
        <p>Watch any video together – YouTube, Google Drive, direct MP4/MKV/WebM/HLS links!</p>
        <div class="join-box">
            <input type="text" id="nameInput" placeholder="Enter your name (optional)" autofocus>
            <button id="joinBtn">Join Party</button>
        </div>
        <div class="platforms">
            <span>Supported: YouTube • Google Drive • Any video URL (MP4, MKV, WebM, etc.)</span>
        </div>
    </div>

    <script>
        document.getElementById('joinBtn').addEventListener('click', () => {
            const name = document.getElementById('nameInput').value.trim();
            window.location.href = `/watch.html?name=${encodeURIComponent(name)}`;
        });
        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('joinBtn').click();
        });
    </script>
</body>
</html>
